<div class="voteButtons" [class.horizontal]="!vertical" [class.disabled]="!isLoggedIn">
  <button
    class="voteBtn upvote"
    [class.active]="userVote === 1"
    [disabled]="isVoting || !isLoggedIn"
    (click)="vote(1)"
    [title]="isLoggedIn ? 'Upvote' : 'Log in to vote'"
  >
    ▲
  </button>
  <span class="voteScore" [class.positive]="score > 0" [class.negative]="score < 0">
    {{ score }}
  </span>
  <button
    class="voteBtn downvote"
    [class.active]="userVote === -1"
    [disabled]="isVoting || !isLoggedIn"
    (click)="vote(-1)"
    [title]="isLoggedIn ? 'Downvote' : 'Log in to vote'"
  >
    ▼
  </button>
</div>
